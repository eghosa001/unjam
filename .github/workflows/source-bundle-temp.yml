name: Source Bundle Temp

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -r unjam-source.zip . -x '.git/*' 'unjam-source.zip'
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: unjam-source-bundle
          path: unjam-source.zip
          if-no-files-found: error
          retention-days: 1
