name: One-shot CC0 UNJAM music import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-cc0-music.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Fetch and prepare CC0 puzzle theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cc0-music
          SRC="https://opengameart.org/sites/default/files/cozy_puzzle_in-game_2_bpm90_0.ogg"
          curl -L --fail --retry 4 --retry-delay 2 "$SRC" -o build/cc0-music/original.ogg
          ffmpeg -hide_banner -y -i build/cc0-music/original.ogg             -af "highpass=f=65,lowpass=f=15500,equalizer=f=2800:t=q:w=1.0:g=-1.2,volume=0.92"             -c:a libvorbis -q:a 6 build/cc0-music/unjam_puzzle_theme.ogg
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 build/cc0-music/unjam_puzzle_theme.ogg > build/cc0-music/audio-info.txt
          sha256sum build/cc0-music/original.ogg build/cc0-music/unjam_puzzle_theme.ogg >> build/cc0-music/audio-info.txt
          cat > build/cc0-music/LICENSE.txt <<'EOF'
          UNJAM background music source
          Title: Cozy Puzzle In-Game 2
          Author: MintoDog
          Source: https://opengameart.org/content/cozy-puzzle-in-game-2
          License: CC0 / public-domain dedication
          Original file: cozy_puzzle_in-game_2_bpm90_0.ogg
          UNJAM modification: subtle high/low filtering, -1.2 dB upper-mid EQ, and -0.72 dB gain.
          Attribution is not required by CC0, but source information is retained for provenance.
          EOF
      - name: Commit selected CC0 theme to import branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          cp build/cc0-music/original.ogg assets/audio/unjam_puzzle_theme.ogg
          cp build/cc0-music/LICENSE.txt assets/audio/UNJAM_PUZZLE_THEME_LICENSE.txt
          git config user.name "UNJAM Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B import/cc0-puzzle-theme
          git add assets/audio/unjam_puzzle_theme.ogg assets/audio/UNJAM_PUZZLE_THEME_LICENSE.txt
          git commit -m "Add CC0 human-composed puzzle theme"
          git push --force origin HEAD:refs/heads/import/cc0-puzzle-theme
