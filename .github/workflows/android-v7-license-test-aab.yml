name: UNJAM v7 License Test AAB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-v7-license-test-aab.yml"

permissions:
  contents: read

concurrency:
  group: unjam-v7-license-test-aab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_PACKAGE: com.eghosa.unjamgam
      VERSION_CODE: "7"
      VERSION_NAME: "1.0.7"
      EXPECTED_UPLOAD_SHA1: ${{ secrets.UNJAM_ANDROID_UPLOAD_SHA1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate v7 monetization mode
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py
          python3 tools/validate_purchase_claim_protocol.py
          grep -Fx 'test_mode=false' project.godot
          grep -Fx 'admob_test_mode=true' project.godot
          grep -F 'ca-app-pub-7517898921176341~1892369383' project.godot
          grep -F 'ca-app-pub-7517898921176341/2926249456' project.godot
          grep -F 'ca-app-pub-7517898921176341/9108514429' project.godot
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'gradle_build/export_format=1' export_presets.cfg
          grep -Fx 'gradle_build/target_sdk="36"' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg
          grep -F 'com.google.android.gms.permission.AD_ID' export_presets.cfg

      - name: Verify live purchase backend
        env:
          UNJAM_DEVELOPER_WEBSITE_URL: ${{ vars.UNJAM_DEVELOPER_WEBSITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_live_monetization.py

      - name: Configure signing for Play track or Internal App Sharing
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS_SECRET: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unjam-v7.keystore"
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS_SECRET" && -n "$KEY_PASSWORD_SECRET" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            KEY_ALIAS="$KEY_ALIAS_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            SIGNING_MODE="play-upload-key"
          else
            KEY_ALIAS="unjam-v7-internal-sharing"
            KEY_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -v               -keystore "$KEYSTORE"               -storepass "$KEY_PASSWORD"               -keypass "$KEY_PASSWORD"               -alias "$KEY_ALIAS"               -keyalg RSA -keysize 2048 -validity 3650               -dname "CN=UNJAM Internal App Sharing,O=UNJAM,C=NG" >/dev/null 2>&1
            SIGNING_MODE="internal-app-sharing"
          fi
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          if [[ "$SIGNING_MODE" == "play-upload-key" && -n "$EXPECTED_UPLOAD_SHA1" ]]; then
            EXPECTED="$(printf '%s' "$EXPECTED_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = "$EXPECTED"
          fi
          echo "UNJAM_BUILD_UPLOAD_SHA1=$ACTUAL" >> "$GITHUB_ENV"
          echo "UNJAM_SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_MODE" > build-signing-mode.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Prepare Android branding
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tools/prepare_android_brand_assets.gd
          test -s assets/icon_user_512.png
          test -s assets/icon_launcher_adaptive_432.png
          test -s assets/splash_emblem_safe_432.png
          test -s assets/unjam_startup_logo.png

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER="$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Set v7 export metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("export_presets.cfg")
          s=p.read_text()
          s=re.sub(r'version/code=\d+', 'version/code=7', s)
          s=re.sub(r'version/name="[^"]*"', 'version/name="1.0.7"', s)
          p.write_text(s)
          PY
          grep -Fx 'version/code=7' export_presets.cfg
          grep -Fx 'version/name="1.0.7"' export_presets.cfg
          grep -Fx 'package/signed=true' export_presets.cfg
          grep -Fx 'gradle_build/export_format=1' export_presets.cfg

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Run focused v7 gates
        shell: bash
        run: |
          set -euo pipefail
          for t in             validate_launcher_icon_safe_zone             validate_touch_enhancer_scope             validate_bottom_nav_touch_zones             validate_soothing_audio_palette             validate_feedback_manager_event_driven_music             validate_runtime_efficiency             validate_gameplay_interactions             validate_monetization             validate_restore_purchase_flow             validate_admob_production             validate_billing_production; do
            echo "===== $t ====="
            timeout 180s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Export signed release APK for manifest verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          cp export_presets.cfg "$RUNNER_TEMP/export_presets.aab.cfg"
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/unjam-v7-license-test-check.apk 2>&1 | tee build/android/v7-apk-export.log
          test -s build/android/unjam-v7-license-test-check.apk
          cp "$RUNNER_TEMP/export_presets.aab.cfg" export_presets.cfg

      - name: Verify v7 ads billing and package
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android/unjam-v7-license-test-check.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -1)"
          "$AAPT" dump badging "$APK" | tee build/android/v7-badging.txt
          "$AAPT" dump permissions "$APK" | tee build/android/v7-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/android/v7-manifest.txt
          grep -F "package: name='com.eghosa.unjamgam' versionCode='7' versionName='1.0.7'" build/android/v7-badging.txt
          grep -F "targetSdkVersion:'36'" build/android/v7-badging.txt
          grep -F "native-code: 'arm64-v8a'" build/android/v7-badging.txt
          grep -F "com.android.vending.BILLING" build/android/v7-permissions.txt
          grep -F "com.google.android.gms.permission.AD_ID" build/android/v7-permissions.txt
          grep -F "com.google.android.gms.ads.APPLICATION_ID" build/android/v7-manifest.txt
          grep -F "ca-app-pub-7517898921176341~1892369383" build/android/v7-manifest.txt
          grep -F "com.google.android.play.billingclient.version" build/android/v7-manifest.txt
          grep -F "org.godotengine.plugin.v2.GodotGooglePlayBilling" build/android/v7-manifest.txt
          rm -f "$APK"

      - name: Export signed v7 AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-release Android build/android/UNJAM-v7-license-test.aab 2>&1 | tee build/android/v7-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" build/android/v7-aab-export.log; then exit 1; fi
          test -s build/android/UNJAM-v7-license-test.aab

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/android/UNJAM-v7-license-test.aab
          jarsigner -verify -verbose -certs "$AAB" | tee build/android/v7-jarsigner.txt
          grep -F "jar verified." build/android/v7-jarsigner.txt
          BUNDLE_SHA1="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          EXPECTED="$(printf '%s' "$UNJAM_BUILD_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
          test "$BUNDLE_SHA1" = "$EXPECTED"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB" | tee build/android/UNJAM-v7-license-test.aab.sha256

      - name: Upload v7 AAB
        uses: actions/upload-artifact@v4
        with:
          name: UNJAM-v7-license-test-aab
          path: |
            build/android/UNJAM-v7-license-test.aab
            build/android/UNJAM-v7-license-test.aab.sha256
            build/android/v7-jarsigner.txt
            build/android/v7-badging.txt
            build/android/v7-permissions.txt
            build/android/v7-manifest.txt
            build-signing-mode.txt
          retention-days: 14
          if-no-files-found: error
