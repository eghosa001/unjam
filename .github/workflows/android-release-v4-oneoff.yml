name: UNJAM Version 4 AAB Build

on:
  push:
    branches: [main]
    paths:
      - ".release-v4-trigger"

permissions:
  contents: read

concurrency:
  group: unjam-version-4-aab
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate source release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -F 'com.google.android.gms.permission.AD_ID' export_presets.cfg

      - name: Configure Version 4 unsigned export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("export_presets.cfg")
          s=p.read_text()
          s=re.sub(r'version/code=\d+', 'version/code=4', s)
          s=re.sub(r'version/name="[^"]*"', 'version/name="1.0.4"', s)
          s=s.replace('package/signed=true','package/signed=false')
          p.write_text(s)
          PY
          grep -Fx 'version/code=4' export_presets.cfg
          grep -Fx 'version/name="1.0.4"' export_presets.cfg
          grep -Fx 'package/signed=false' export_presets.cfg

      - name: Verify live monetization
        env:
          UNJAM_DEVELOPER_WEBSITE_URL: ${{ vars.UNJAM_DEVELOPER_WEBSITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_live_monetization.py
          python3 tools/validate_purchase_claim_protocol.py

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Import and validate Version 4
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee aab-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" aab-import.log; then exit 1; fi
          for t in validate_runtime_efficiency validate_monetization validate_billing_production validate_restore_purchase_flow validate_retention validate_robustness; do
            timeout 120s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Export Version 4 AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/UNJAM-Version-4-unsigned.aab 2>&1 | tee android-v4-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-v4-aab-export.log; then exit 1; fi
          test -s build/android/UNJAM-Version-4-unsigned.aab
          unzip -t build/android/UNJAM-Version-4-unsigned.aab | tee build/android/aab-zip-test.log
          sha256sum build/android/UNJAM-Version-4-unsigned.aab | tee build/android/UNJAM-Version-4-unsigned.aab.sha256

      - name: Upload Version 4 unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-4-unsigned-aab
          path: |
            build/android/UNJAM-Version-4-unsigned.aab
            build/android/UNJAM-Version-4-unsigned.aab.sha256
            build/android/aab-zip-test.log
          if-no-files-found: error
          retention-days: 14
