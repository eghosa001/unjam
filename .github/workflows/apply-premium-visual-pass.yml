name: Apply Premium Visual Pass

on:
  push:
    branches:
      - visual-reboot-3d-build-final2
    paths:
      - '.github/workflows/apply-premium-visual-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified visual patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d06abe58c077eeca5183917300957df99aa0e4d"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/eghosa001/unjam/git/blobs/a8776f5a6958c842679e305689d0526d06efd7ce \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/visual-pass.patch.gz
          gzip -dc /tmp/visual-pass.patch.gz > /tmp/visual-pass.patch
          echo '754e2b7d189d9ca87ed09e2cc2f2ad071cae3f0c2e850ad29c56378e6b5957d0  /tmp/visual-pass.patch' | sha256sum -c -
          git apply --check /tmp/visual-pass.patch
          git apply --index /tmp/visual-pass.patch
          changed="$(git diff --cached --name-only)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 6
          if printf '%s\n' "$changed" | grep -Eq '^\.github/|^addons/stagehand/|^project\.godot$|(^|/)\.uid$'; then
            echo 'Unexpected generated/QA file in premium visual pass' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'AIGHEWI EGHOSA'
          git config user.email 'aighewieghosa111@gmail.com'
          git commit -m 'visual: enlarge water and rescue gameplay focus'
          git push origin HEAD:main
