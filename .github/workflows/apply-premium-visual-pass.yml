name: Apply Premium Visual Pass

on:
  push:
    branches:
      - visual-reboot-3d-build-final2
    paths:
      - '.github/workflows/apply-premium-visual-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified visual patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9333fcc6ed9a7ad84bed56225969455637c3c279"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/eghosa001/unjam/git/blobs/c1a0ed0b143431082f050374f33249e96f86ad3a \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/visual-pass.patch.gz
          gzip -dc /tmp/visual-pass.patch.gz > /tmp/visual-pass.patch
          echo 'a7802dd7cf53d525d9448ef6de882ca4f540a6c8e72717491627e34c56818146  /tmp/visual-pass.patch' | sha256sum -c -
          git apply --check /tmp/visual-pass.patch
          git apply --index /tmp/visual-pass.patch
          changed="$(git diff --cached --name-only)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 7
          if printf '%s\n' "$changed" | grep -Eq '^\.github/|^addons/stagehand/|^project\.godot$|(^|/)\.uid$'; then
            echo 'Unexpected generated/QA file in premium visual pass' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'AIGHEWI EGHOSA'
          git config user.email 'aighewieghosa111@gmail.com'
          git commit -m 'visual: sharpen home selector and block puzzle hierarchy'
          git push origin HEAD:main
