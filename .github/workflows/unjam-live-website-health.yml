name: UNJAM Live Website Health

on:
  workflow_dispatch:
  schedule:
    - cron: "9 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live developer website and authorized seller record
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://unjam-eghosa.onrender.com"
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/" | grep -q 'UNJAM'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/privacy.html" | grep -q 'Privacy Policy'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/support.html" | grep -q 'UNJAM Support'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/assets/site.css" | grep -q '{'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/assets/icon.svg" | grep -qi 'svg'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/robots.txt" | grep -q 'User-agent:'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/sitemap.xml" | grep -q 'urlset'
          curl --fail --show-error --silent --location --max-time 20 "$ROOT/app-ads.txt" |
            grep -Fx 'google.com, pub-7517898921176341, DIRECT, f08c47fec0942fa0'
