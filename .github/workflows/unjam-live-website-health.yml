name: UNJAM Live Website Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_public_site.py"
      - "index.md"
      - "privacy.md"
      - "support.md"
      - "app-ads.txt"
      - ".github/workflows/unjam-live-website-health.yml"
  schedule:
    - cron: "9 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live developer website and authorized seller record
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://unjam-eghosa.onrender.com"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          assert_page() {
            local path="$1" needle="$2" filename="$3"
            curl --fail --show-error --silent --location --retry 2 --max-time 20 \
              --output "$TMP/$filename" "$ROOT$path"
            grep -Fqi -- "$needle" "$TMP/$filename"
            printf 'PASS %s (%s bytes)\n' "$path" "$(wc -c < "$TMP/$filename")"
          }
          assert_page "/" "UNJAM" "index.html"
          assert_page "/privacy.html" "Privacy Policy" "privacy.html"
          assert_page "/support.html" "UNJAM Support" "support.html"
          assert_page "/assets/site.css" "{" "style.css"
          assert_page "/assets/icon.svg" "<svg" "icon.svg"
          assert_page "/robots.txt" "User-agent:" "robots.txt"
          assert_page "/sitemap.xml" "urlset" "sitemap.xml"
          assert_page "/app-ads.txt" "google.com, pub-7517898921176341, DIRECT, f08c47fec0942fa0" "app-ads.txt"
