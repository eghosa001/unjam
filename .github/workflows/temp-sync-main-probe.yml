name: Temporary Main Sync Probe

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - visual-reboot-3d-build-final2

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@v4
        with:
          ref: visual-reboot-3d-build-final2
          fetch-depth: 0

      - name: Reproduce main merge and capture state
        shell: bash
        run: |
          set -u
          git config user.name "UNJAM Sync Probe"
          git config user.email "sync-probe@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e
          mkdir -p sync_state
          printf '%s\n' "$MERGE_STATUS" > sync_state/merge_status.txt
          git status --porcelain=v1 > sync_state/status.txt
          git diff --name-only --diff-filter=U > sync_state/conflicts.txt
          git diff --cached --name-status > sync_state/staged.txt
          git ls-files -s > sync_state/index.txt
          git rev-parse HEAD > sync_state/feature_head.txt
          git rev-parse origin/main > sync_state/main_head.txt

      - name: Upload conflicted merge working tree
        uses: actions/upload-artifact@v4
        with:
          name: unjam-main-sync-state
          path: |
            .
            !.git/**
            !.godot/**
            !build/**
          include-hidden-files: true
          retention-days: 1
