name: Deep Audit Once

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: deep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" import.log; then exit 1; fi
      - name: Run audit-only validators
        shell: bash
        run: |
          set -euxo pipefail
          for t in \
            validate_3d_initial_render_prime \
            validate_3d_rebuild_atomic \
            validate_3d_visual_reboot \
            validate_ambient_rebuild_atomic \
            validate_assist_runtime \
            validate_backdrop_visibility_lifecycle \
            validate_block_clear_order \
            validate_block_piece_idle_processing \
            validate_block_piece_rebuild_atomic \
            validate_block_puzzle_premium_visual_hierarchy \
            validate_block_retired_piece_reference \
            validate_compact_gameplay_stack \
            validate_feedback_manager_event_driven_music \
            validate_home_event_driven \
            validate_home_premium_visual_hierarchy \
            validate_home_return_atomic \
            validate_hybrid_gameplay_rules \
            validate_live_event_driven \
            validate_live_hub_launcher_idle \
            validate_mascot_render_lifecycle \
            validate_persistent_surface_immediate_handoff \
            validate_persistent_surface_rebuild_atomic \
            validate_premium_visuals_motion_process \
            validate_rescue_board_rebuild_atomic \
            validate_rescue_no_repeat_board_intro \
            validate_rescue_premium_visual_hierarchy \
            validate_rescue_restart_atomic \
            validate_rescue_result_ownership \
            validate_retention_refresh_atomic \
            validate_secondary_header_single_owner \
            validate_secondary_surface_atomic_replacements \
            validate_selector_premium_card_hierarchy \
            validate_surface_polish_idempotent \
            validate_surface_replacement_atomic \
            validate_touch_enhancer_scope \
            validate_water_idle_status_after_pour \
            validate_water_premium_visual_hierarchy \
            validate_water_sort_type_safety \
            validate_water_tube_3d_layering; do
            echo "===== START $t ====="
            timeout 90s godot --headless --path . --script "res://tests/$t.gd"
            echo "===== PASS $t ====="
          done
