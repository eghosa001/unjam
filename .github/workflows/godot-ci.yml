name: Godot Selective CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: godot-selective-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select checks for changed files
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/select_fast_ci_tests.py --self-test
          BASE_SHA="$PR_BASE_SHA"
          HEAD_SHA="$PR_HEAD_SHA"
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA="$PUSH_BASE_SHA"; fi
          if [[ -z "$HEAD_SHA" ]]; then HEAD_SHA="$PUSH_HEAD_SHA"; fi
          python3 tools/select_fast_ci_tests.py             --base "$BASE_SHA"             --head "$HEAD_SHA"             --github-output "$GITHUB_OUTPUT"

      - name: Validate static release contract
        if: steps.plan.outputs.release_contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py

      - name: Setup Godot 4.7.2
        if: steps.plan.outputs.needs_godot == 'true'
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false

      - name: Disable release-only editor plugins
        if: steps.plan.outputs.needs_godot == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.godot")
          text = path.read_text()
          enabled = 'enabled=PackedStringArray("res://addons/admob/plugin.cfg", "res://addons/GodotGooglePlayBilling/plugin.cfg")'
          if enabled not in text:
              raise SystemExit("Expected monetization editor-plugin declaration is missing")
          path.write_text(text.replace(enabled, "enabled=PackedStringArray()"))
          PY

      - name: Import project and reject script errors
        if: steps.plan.outputs.needs_godot == 'true'
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" import.log; then exit 1; fi

      # Selective hardening gates are planned by tools/select_fast_ci_tests.py:
      # validate_production_hardening_regressions and
      # validate_water_constructive_solvability. They run only for relevant
      # shared-gameplay/Water changes; exhaustive 10,000-level audits stay manual.
      - name: Run selected iteration contracts
        if: steps.plan.outputs.tests != ''
        env:
          FAST_TESTS: ${{ steps.plan.outputs.tests }}
        shell: bash
        run: |
          set -euxo pipefail
          for t in $FAST_TESTS; do
            bash tools/run_godot_test.sh "$t" 45
          done

      - name: Boot smoke test
        if: steps.plan.outputs.needs_godot == 'true'
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" boot.log; then exit 1; fi

      - name: Capture only affected rendered screens
        if: steps.plan.outputs.visual_scope != ''
        env:
          UNJAM_FAST_VISUAL_AUDIT: "1"
          UNJAM_FAST_VISUAL_AUDIT_SCOPE: ${{ steps.plan.outputs.visual_scope }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/visual-audit
          timeout 180s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_visual_audit.gd 2>&1 | tee visual-audit.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access|ObjectDB instances were leaked|Leaked instance:" visual-audit.log; then exit 1; fi

          IFS=',' read -ra SCOPES <<< "$UNJAM_FAST_VISUAL_AUDIT_SCOPE"
          for scope in "${SCOPES[@]}"; do
            case "$scope" in
              home) test -s build/visual-audit/01-home-dark.png ;;
              games) test -s build/visual-audit/02b-live-540x960-dark.png ;;
              levels)
                test -s build/visual-audit/03b-levels-rescue-540x960-dark.png
                test -s build/visual-audit/12b-levels-block-540x960-dark.png
                ;;
              collection)
                test -s build/visual-audit/05b-collection-540x960-dark.png
                test -s build/visual-audit/05f-collection-upgrades-540x960-dark.png
                ;;
              daily) test -s build/visual-audit/05d-daily-540x960-dark.png ;;
              settings) test -s build/visual-audit/06b-settings-540x960-dark.png ;;
              shop) test -s build/visual-audit/06d-shop-540x960-dark.png ;;
              coins) test -s build/visual-audit/06f-insufficient-coins-540x960-dark.png ;;
              retention) test -s build/visual-audit/06g-retention-hub-540x960-dark.png ;;
              rescue) test -s build/visual-audit/09c-game-rescue-motion-540x960.png ;;
              water) test -s build/visual-audit/10c-game-water-pouring-540x960.png ;;
              block) test -s build/visual-audit/11-game-block.png ;;
              tutorial) test -s build/visual-audit/15b-tutorial-540x960-dark.png ;;
              result) test -s build/visual-audit/16b-result-540x960-dark.png ;;
              *) echo "Unknown visual scope: $scope" >&2; exit 1 ;;
            esac
          done

      - name: Upload fast-CI evidence
        if: always() && steps.plan.outputs.needs_godot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unjam-selective-ci-evidence
          path: |
            build/visual-audit/*.png
            import.log
            boot.log
            visual-audit.log
          if-no-files-found: warn
          retention-days: 3

# Fast CI is intentionally change-scoped. It must never grow back into the
# production-release suite. Android exports, monetization plugin verification,
# exhaustive 10,000-level audits, campaign generation/solving, and the full
# visual matrix remain in explicit production/manual workflows.
