name: Godot Fast CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: godot-fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate static release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false

      - name: Disable release-only editor plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.godot")
          text = path.read_text()
          enabled = 'enabled=PackedStringArray("res://addons/admob/plugin.cfg", "res://addons/GodotGooglePlayBilling/plugin.cfg")'
          if enabled not in text:
              raise SystemExit("Expected monetization editor-plugin declaration is missing")
          path.write_text(text.replace(enabled, "enabled=PackedStringArray()"))
          PY

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" import.log; then exit 1; fi

      - name: Run high-signal iteration contracts
        shell: bash
        run: |
          set -euxo pipefail
          for t in             validate_requested_polish_contract             validate_reported_polish_regressions             validate_uiux_regressions             validate_viewport_fit             validate_compact_gameplay_stack             validate_transition_ownership             validate_gameplay_interactions             validate_progression_transitions             validate_daily_and_late_water_runtime             validate_water_liquid_continuity             validate_water_pour_arc             validate_block_visual_integrity             validate_block_single_touch_owner             validate_rescue_token_render_lifecycle             validate_theme_integrity
          do
            bash tools/run_godot_test.sh "$t" 45
          done

      - name: Boot smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" boot.log; then exit 1; fi

      - name: Capture rendered regression screens
        env:
          UNJAM_FAST_VISUAL_AUDIT: "1"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/visual-audit
          timeout 180s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_visual_audit.gd 2>&1 | tee visual-audit.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access|ObjectDB instances were leaked|Leaked instance:" visual-audit.log; then exit 1; fi
          test -s build/visual-audit/01-home-dark.png
          test -s build/visual-audit/09c-game-rescue-motion-540x960.png
          test -s build/visual-audit/10c-game-water-pouring-540x960.png
          test -s build/visual-audit/11-game-block.png
          test -s build/visual-audit/15b-tutorial-540x960-dark.png
          test -s build/visual-audit/16b-result-540x960-dark.png

      - name: Upload rendered regression screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unjam-fast-visual-audit
          path: |
            build/visual-audit/*.png
            import.log
            boot.log
            visual-audit.log
          if-no-files-found: warn
          retention-days: 3

# Intentionally excluded from the inner development loop:
# Android APK/AAB exports, API 36 installation, 16 KB ELF inspection,
# purchase-verifier backend validation, exhaustive 10,000-level campaign
# generation/solving, and full monetization checks. Those remain in the
# explicit production-release/manual workflows.
