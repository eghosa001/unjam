name: Godot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Upload current source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: unjam-current-source
          path: |
            .
            !.git/**
            !build/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" import.log; then exit 1; fi
      - name: Upload Godot import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unjam-import-diagnostics
          path: import.log
          if-no-files-found: warn
          retention-days: 3
      - name: Validate all suites
        shell: bash
        run: |
          set -euxo pipefail
          for t in validate_levels validate_campaign validate_retention validate_robustness validate_level_launch validate_gameplay_interactions validate_motion_quality validate_uiux_regressions validate_viewport_fit validate_first_100_progression validate_first_200_playability validate_campaign_1000 validate_monetization validate_premium_ux; do
            godot --headless --path . --script "res://tests/$t.gd"
          done
      - name: Boot smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" boot.log; then exit 1; fi
      - name: Render visual audit screenshots
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/visual-audit
          xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_visual_audit.gd 2>&1 | tee visual-audit.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" visual-audit.log; then exit 1; fi
          test -s build/visual-audit/01-home-dark.png
          test -s build/visual-audit/11-game-block.png
      - name: Upload visual audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: unjam-visual-audit
          path: build/visual-audit/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/unjam-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unjam Debug,O=Unjam,C=NG"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/unjam-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Android API 36 Gradle APK export smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          cp export_presets.cfg "$RUNNER_TEMP/export_presets.aab.cfg"
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          godot --headless --verbose --path . --install-android-build-template --export-debug Android build/android/unjam-debug.apk 2>&1 | tee android-apk-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-apk-export.log; then exit 1; fi
          test -s build/android/unjam-debug.apk
          cp "$RUNNER_TEMP/export_presets.aab.cfg" export_presets.cfg
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-debug-apk
          path: build/android/unjam-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Android API 36 Gradle AAB export smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --export-debug Android build/android/unjam-debug.aab 2>&1 | tee android-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-aab-export.log; then exit 1; fi
          test -s build/android/unjam-debug.aab
      - name: Upload Android debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-debug-aab
          path: build/android/unjam-debug.aab
          if-no-files-found: error
          retention-days: 7
