name: Godot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.5.1-stable
          export-templates: true
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed" import.log; then
            echo "Godot script/import errors detected."
            exit 1
          fi
      - name: Validate handcrafted levels
        run: godot --headless --path . --script res://tests/validate_levels.gd
      - name: Validate campaign structure pacing and solvability
        run: godot --headless --path . --script res://tests/validate_campaign.gd
      - name: Validate retention systems
        run: godot --headless --path . --script res://tests/validate_retention.gd
      - name: Validate production robustness
        run: godot --headless --path . --script res://tests/validate_robustness.gd
      - name: Validate Level 1 launch and board render
        run: godot --headless --path . --script res://tests/validate_level_launch.gd
      - name: Parse and boot smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" boot.log; then
            echo "Godot runtime errors detected."
            exit 1
          fi
      - name: Prepare Android export toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          test -x "$ANDROID_ROOT/platform-tools/adb"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/unjam-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Unjam Debug,O=Unjam,C=NG"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/unjam-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Android debug export smoke test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug Android build/android/unjam-debug.apk
          test -s build/android/unjam-debug.apk
          file build/android/unjam-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-debug-apk
          path: build/android/unjam-debug.apk
          if-no-files-found: error
          retention-days: 7
