name: UNJAM Version 6 Unsigned Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/version-6-unsigned-staging.yml"

permissions:
  contents: read

concurrency:
  group: unjam-version-6-unsigned-staging
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Configure Version 6 unsigned export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = re.sub(r'version/code=\d+', 'version/code=6', s)
          s = re.sub(r'version/name="[^"]*"', 'version/name="1.0.6"', s)
          s = s.replace('package/signed=true', 'package/signed=false')
          p.write_text(s)
          PY
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'version/code=6' export_presets.cfg
          grep -Fx 'version/name="1.0.6"' export_presets.cfg
          grep -Fx 'package/signed=false' export_presets.cfg
          grep -Fx 'gradle_build/export_format=1' export_presets.cfg
          grep -Fx 'gradle_build/target_sdk="36"' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg

      - name: Import and run Water selection regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          for t in validate_water_selection_release_visibility validate_water_tube_3d_layering validate_runtime_efficiency validate_gameplay_interactions; do
            timeout 180s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Export Version 6 unsigned AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/UNJAM-Version-6-unsigned.aab 2>&1 | tee android-v6-unsigned-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-v6-unsigned-export.log; then exit 1; fi
          test -s build/android/UNJAM-Version-6-unsigned.aab
          unzip -t build/android/UNJAM-Version-6-unsigned.aab > build/android/aab-zip-test.log
          sha256sum build/android/UNJAM-Version-6-unsigned.aab > build/android/UNJAM-Version-6-unsigned.aab.sha256

      - name: Upload Version 6 unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-6-unsigned-aab
          path: |
            build/android/UNJAM-Version-6-unsigned.aab
            build/android/UNJAM-Version-6-unsigned.aab.sha256
            build/android/aab-zip-test.log
          if-no-files-found: error
          retention-days: 7
