name: UNJAM Historical Test Prerelease (retired)

# The 1.0.12 debug-signed test prerelease already exists. Do not trigger a
# frozen 1.0.12 publication workflow after every new Android version.
# Current release-mode QA builds use android-release-test-apk.yml.
# Play production bundles use android-release.yml, with mandatory live gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-release-info:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current release routes
        run: |
          echo "Historical v1.0.12-rc.1 is immutable and already published."
          echo "For installable test builds run UNJAM Installable Release-Mode QA APK."
          echo "For a Play-signable AAB run Android Production Release."
