name: UNJAM Version 3 AAB
# unsigned fallback when repository signing secrets are unavailable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-v3-aab.yml"

permissions:
  contents: read

concurrency:
  group: unjam-version-3-aab
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WATER_FULL_AUDIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Version 3 release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'version/code=3' export_presets.cfg
          grep -Fx 'version/name="1.0.3"' export_presets.cfg
          grep -Fx 'gradle_build/export_format=1' export_presets.cfg
          grep -F 'com.google.android.gms.permission.AD_ID' export_presets.cfg
          python3 tools/validate_release_contract.py

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install Android monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Configure signing when available
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/unjam-release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            ACTUAL_UPLOAD_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
            printf 'signed\ncertificate_sha1=%s\n' "$ACTUAL_UPLOAD_SHA1" > build-signing-status.txt
          else
            sed -i 's/package\/signed=true/package\/signed=false/' export_presets.cfg
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            printf 'unsigned\nreason=GitHub Actions production keystore secrets are not configured\n' > build-signing-status.txt
          fi

      - name: Import project and run focused release gates
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          for t in validate_runtime_efficiency validate_monetization validate_admob_production validate_billing_production validate_production_completion validate_viewport_fit validate_theme_integrity validate_soothing_audio_palette; do
            timeout 120s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Generate and audit Block Puzzle campaign pack
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/block_puzzle_campaign
          timeout 3600s godot --headless --path . --script res://tools/generate_block_campaign_pack.gd
          test -s data/block_puzzle_campaign/manifest.json
          test -s data/block_puzzle_campaign/human_review.json
          test "$(find data/block_puzzle_campaign -maxdepth 1 -name 'world_*.json' | wc -l)" -eq 20
          timeout 3600s godot --headless --path . --script res://tools/audit_block_campaign_pack.gd
          timeout 180s godot --headless --path . --script res://tests/validate_block_pack_runtime.gd
          sha256sum data/block_puzzle_campaign/human_review.json | tee data/block_puzzle_campaign/human_review.sha256

      - name: Export release APK for manifest verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          cp export_presets.cfg "$RUNNER_TEMP/export-presets-aab.cfg"
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/unjam-v3-check.apk
          test -s build/android/unjam-v3-check.apk
          cp "$RUNNER_TEMP/export-presets-aab.cfg" export_presets.cfg

      - name: Verify package, Version 3 and monetization manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android/unjam-v3-check.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -1)"
          "$AAPT" dump badging "$APK" | tee build/android/unjam-v3-badging.txt
          "$AAPT" dump permissions "$APK" | tee build/android/unjam-v3-permissions.txt
          grep -F "package: name='com.eghosa.unjamgam' versionCode='3' versionName='1.0.3'" build/android/unjam-v3-badging.txt
          grep -F "targetSdkVersion:'36'" build/android/unjam-v3-badging.txt
          grep -F "native-code: 'arm64-v8a'" build/android/unjam-v3-badging.txt
          grep -F "com.google.android.gms.permission.AD_ID" build/android/unjam-v3-permissions.txt
          grep -F "com.android.vending.BILLING" build/android/unjam-v3-permissions.txt
          rm -f "$APK"

      - name: Export Version 3 AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-release Android build/android/UNJAM-Version-3.aab 2>&1 | tee android-v3-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-v3-aab-export.log; then exit 1; fi
          test -s build/android/UNJAM-Version-3.aab

      - name: Verify AAB archive
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/android/UNJAM-Version-3.aab
          unzip -t "$AAB" | tee build/android/aab-zip-test.log
          sha256sum "$AAB" | tee build/android/UNJAM-Version-3.aab.sha256
          if [[ "$SIGNED_BUILD" == "true" ]]; then
            jarsigner -verify -verbose -certs "$AAB" > build/android/jarsigner-verify.log
          else
            printf 'Unsigned release bundle. Sign with the registered Google Play upload key before upload.\n' > build/android/jarsigner-verify.log
          fi

      - name: Upload Version 3 AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-3-aab
          path: |
            build/android/UNJAM-Version-3.aab
            build/android/UNJAM-Version-3.aab.sha256
            build/android/jarsigner-verify.log
            build/android/aab-zip-test.log
            build/android/unjam-v3-badging.txt
            build/android/unjam-v3-permissions.txt
            build-signing-status.txt
            data/block_puzzle_campaign/manifest.json
            data/block_puzzle_campaign/human_review.json
            data/block_puzzle_campaign/human_review.sha256
          if-no-files-found: error
          retention-days: 14
