name: Source Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: unjam-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
