name: Block Puzzle Campaign Review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block-puzzle-campaign-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit

      - name: Generate exact-solver campaign pack
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/block_puzzle_campaign
          timeout 3600s godot --headless --path . --script res://tools/generate_block_campaign_pack.gd
          test -s data/block_puzzle_campaign/manifest.json
          test -s data/block_puzzle_campaign/human_review.json
          test "$(find data/block_puzzle_campaign -maxdepth 1 -name 'world_*.json' | wc -l)" -eq 20

      - name: Audit all 10000 levels
        shell: bash
        run: |
          set -euxo pipefail
          timeout 3600s godot --headless --path . --script res://tools/audit_block_campaign_pack.gd
          timeout 180s godot --headless --path . --script res://tests/validate_block_pack_runtime.gd

      - name: Create review fingerprints
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum data/block_puzzle_campaign/human_review.json | tee data/block_puzzle_campaign/human_review.sha256
          sha256sum data/block_puzzle_campaign/manifest.json | tee data/block_puzzle_campaign/manifest.sha256
          du -sh data/block_puzzle_campaign | tee data/block_puzzle_campaign/pack-size.txt

      - name: Upload deterministic review bundle
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-campaign-review
          path: |
            data/block_puzzle_campaign/human_review.json
            data/block_puzzle_campaign/human_review.sha256
            data/block_puzzle_campaign/manifest.json
            data/block_puzzle_campaign/manifest.sha256
            data/block_puzzle_campaign/pack-size.txt
          if-no-files-found: error
          retention-days: 30
