name: Apply attached launcher icon

on:
  push:
    branches: [main]
    paths:
      - tools/apply_attached_launcher_icon.py
      - .github/workflows/apply-attached-launcher-icon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate crisp launcher PNGs
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/apply_attached_launcher_icon.py

      - name: Run focused validation
        run: |
          python -m py_compile tools/validate_release_contract.py
          python tools/validate_release_contract.py

      - name: Commit final icon assets
        run: |
          rm tools/apply_attached_launcher_icon.py
          rm .github/workflows/apply-attached-launcher-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use supplied glossy U launcher icon [skip ci]"
          git push
