name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Human-readable version (for example 1.0.0)
        required: true
        default: 1.0.0
      version_code:
        description: Monotonically increasing Google Play version code
        required: true
        default: 1

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_PACKAGE: com.eghosa.unjamgam
      EXPECTED_UPLOAD_SHA1: ${{ secrets.UNJAM_ANDROID_UPLOAD_SHA1 }}
      WATER_FULL_AUDIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py
      - name: Require production secrets and update version
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
          VERIFY_URL: ${{ secrets.UNJAM_PURCHASE_VERIFICATION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_UPLOAD_SHA1"
          [[ "$EXPECTED_UPLOAD_SHA1" =~ ^([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}$ ]]
          [[ "$VERIFY_URL" == https://*/verify ]]
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]
          test "${{ inputs.version_code }}" -ge 1
          test "${{ inputs.version_code }}" -le 2100000000
          test -n "${{ inputs.version_name }}"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate purchase verifier backend
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/validate_purchase_claim_protocol.py
          cd backend/play-verifier
          npm install --omit=dev --no-audit --no-fund
          npm test
          node --check src/server.js
          node --check src/google_play.js
          node --check src/firestore_ledger.js
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh
      - name: Configure production verification and signing
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
          VERIFY_URL: ${{ secrets.UNJAM_PURCHASE_VERIFICATION_URL }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unjam-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_UPLOAD_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          EXPECTED_UPLOAD_SHA1="$(printf '%s' "$EXPECTED_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_UPLOAD_SHA1" != "$EXPECTED_UPLOAD_SHA1" ]]; then
            echo "Upload certificate mismatch. Expected $EXPECTED_UPLOAD_SHA1 but found $ACTUAL_UPLOAD_SHA1" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path('project.godot')
          text = p.read_text()
          url = os.environ['VERIFY_URL']
          text = re.sub(r'purchase_verification_url="[^"]*"', f'purchase_verification_url="{url}"', text)
          p.write_text(text)

          cfg = Path('export_presets.cfg')
          out = cfg.read_text()
          expected_package = 'package/unique_name="com.eghosa.unjamgam"'
          if expected_package not in out:
              raise SystemExit('Refusing release: package identity changed from com.eghosa.unjamgam')
          out = re.sub(r'version/code=\d+', f'version/code={os.environ["VERSION_CODE"]}', out)
          out = re.sub(r'version/name="[^"]*"', f'version/name="{os.environ["VERSION_NAME"]}"', out)
          cfg.write_text(out)
          PY

          grep -Fx "package/unique_name=\"$EXPECTED_PACKAGE\"" export_presets.cfg
          grep -Fx "version/code=$VERSION_CODE" export_presets.cfg
          grep -Fx "version/name=\"$VERSION_NAME\"" export_presets.cfg

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Import and run release gates
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          for t in validate_motion_quality validate_monetization validate_admob_production validate_billing_production validate_premium_ux validate_visual_quality_contract validate_production_completion validate_uiux_regressions validate_viewport_fit validate_retention validate_robustness validate_production_hardening_regressions; do
            timeout 60s godot --headless --path . --script "res://tests/$t.gd"
          done
      - name: Run focused release gameplay and campaign gates
        shell: bash
        run: |
          set -euxo pipefail
          for t in validate_campaign validate_campaign_diversity validate_level_launch validate_gameplay_interactions validate_progression_transitions validate_water_sort_type_safety validate_water_tube_3d_layering validate_water_premium_visual_hierarchy validate_water_idle_status_after_pour validate_water_tubes_sleep_idle validate_water_assist_runtime validate_block_progression_10000 validate_block_constructive_solvability validate_block_objective_runtime validate_block_level_pack_codec validate_block_exact_solver validate_block_modes_boosters validate_block_bot_calibration validate_water_progression validate_water_pour_arc validate_water_constructive_solvability; do
            echo "===== START $t ====="
            timeout 180s godot --headless --path . --script "res://tests/$t.gd"
            echo "===== PASS $t ====="
          done
      - name: Generate and audit production Block Puzzle campaign pack
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/block_puzzle_campaign
          timeout 3600s godot --headless --path . --script res://tools/generate_block_campaign_pack.gd
          test -s data/block_puzzle_campaign/manifest.json
          test -s data/block_puzzle_campaign/human_review.json
          test "$(find data/block_puzzle_campaign -maxdepth 1 -name 'world_*.json' | wc -l)" -eq 20
          timeout 3600s godot --headless --path . --script res://tools/audit_block_campaign_pack.gd
          timeout 180s godot --headless --path . --script res://tests/validate_block_pack_runtime.gd
          du -sh data/block_puzzle_campaign
      - name: Export release AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/unjam-release.aab 2>&1 | tee android-release-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-release-export.log; then exit 1; fi
          test -s build/android/unjam-release.aab
      - name: Verify 16 KB native page compatibility
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/android/unjam-release.aab
          NATIVE_DIR="$RUNNER_TEMP/unjam-native-libs"
          rm -rf "$NATIVE_DIR"
          mkdir -p "$NATIVE_DIR"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$NATIVE_DIR" || true
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'unjam-native-libs'
          libs = sorted(root.rglob('*.so'))
          if not libs:
              raise SystemExit('No native libraries found in AAB for 16 KB alignment verification')
          failures = []
          for lib in libs:
              out = subprocess.check_output(['readelf', '-lW', str(lib)], text=True, errors='replace')
              aligns = []
              for line in out.splitlines():
                  if re.match(r'^\s*LOAD\s', line):
                      token = line.split()[-1]
                      try:
                          aligns.append(int(token, 16))
                      except ValueError:
                          pass
              if not aligns:
                  failures.append(f'{lib}: no LOAD segments parsed')
                  continue
              if min(aligns) < 0x4000:
                  failures.append(f'{lib}: LOAD alignment {min(aligns):#x} < 0x4000')
          if failures:
              raise SystemExit('16 KB native page compatibility failed:\n' + '\n'.join(failures))
          print(f'16KB_NATIVE_OK: verified {len(libs)} native libraries')
          PY
      - name: Verify signed release AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/android/unjam-release.aab
          jarsigner -verify -verbose -certs "$AAB" | tee build/android/jarsigner-verify.log
          unzip -t "$AAB" | tee build/android/aab-zip-test.log
          BUNDLE_SHA1="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          EXPECTED_UPLOAD_SHA1="$(printf '%s' "$EXPECTED_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
          if [[ "$BUNDLE_SHA1" != "$EXPECTED_UPLOAD_SHA1" ]]; then
            echo "Built AAB certificate mismatch. Expected $EXPECTED_UPLOAD_SHA1 but found $BUNDLE_SHA1" >&2
            exit 1
          fi
          sha256sum "$AAB" | tee build/android/unjam-release.aab.sha256
          echo "Verified package identity source: $EXPECTED_PACKAGE"
          echo "Verified upload certificate SHA-1: $BUNDLE_SHA1"
      - name: Upload release AAB and verification records
        uses: actions/upload-artifact@v4
        with:
          name: unjam-release-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            build/android/unjam-release.aab
            build/android/unjam-release.aab.sha256
            build/android/jarsigner-verify.log
            build/android/aab-zip-test.log
            data/block_puzzle_campaign/manifest.json
            data/block_puzzle_campaign/human_review.json
          if-no-files-found: error
          retention-days: 14
