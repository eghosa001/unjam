name: Monetization Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "app-ads.txt"
      - "privacy.md"
      - "docs/privacy.html"
      - "scripts/systems/admob_config.gd"
      - "scripts/systems/ad_manager.gd"
      - "scripts/systems/android_monetization_bridge.gd"
      - "scripts/systems/privacy_manager.gd"
      - "scripts/systems/purchase_verifier.gd"
      - "scripts/systems/store_manager.gd"
      - "supabase/**"
      - "tools/check_live_monetization.py"
      - "tools/validate_purchase_claim_protocol.py"
      - ".github/workflows/monetization-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate static monetization configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_release_contract.py
          grep -F 'ca-app-pub-7517898921176341~1892369383' project.godot
          grep -F 'ca-app-pub-7517898921176341/2926249456' project.godot
          grep -F 'ca-app-pub-7517898921176341/9108514429' project.godot
          grep -F 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -F 'permissions/internet=true' export_presets.cfg
          grep -F 'permissions/access_network_state=true' export_presets.cfg
          grep -F 'com.google.android.gms.permission.AD_ID' export_presets.cfg
      - name: Check live verifier, app-ads and privacy policy
        env:
          UNJAM_DEVELOPER_WEBSITE_URL: ${{ vars.UNJAM_DEVELOPER_WEBSITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_live_monetization.py
