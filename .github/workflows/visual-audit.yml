name: Visual UI Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
      - name: Import project
        shell: bash
        run: godot --headless --path . --editor --quit
      - name: Capture rendered screens
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/visual-audit
          xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/capture_visual_audit.gd 2>&1 | tee visual-audit.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" visual-audit.log; then exit 1; fi
          test -s build/visual-audit/01-home-dark.png
          test -s build/visual-audit/05-collection-dark.png
          test -s build/visual-audit/08-settings-light.png
          test -s build/visual-audit/09-game-rescue.png
          test -s build/visual-audit/10-game-water.png
          test -s build/visual-audit/11-game-block.png
          test -s build/visual-audit/12-levels-block-dark.png
          test -s build/visual-audit/13-collection-light.png
          test -s build/visual-audit/14-live-light.png
      - name: Upload rendered audit
        uses: actions/upload-artifact@v4
        with:
          name: unjam-visual-audit
          path: build/visual-audit/*.png
          if-no-files-found: error
          retention-days: 7
