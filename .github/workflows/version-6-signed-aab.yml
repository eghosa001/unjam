name: UNJAM Version 6 Signed AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/version-6-signed-aab.yml"

permissions:
  contents: read

concurrency:
  group: unjam-version-6-signed-aab
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_PACKAGE: com.eghosa.unjamgam
      EXPECTED_UPLOAD_SHA1: ${{ secrets.UNJAM_ANDROID_UPLOAD_SHA1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_UPLOAD_SHA1"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Configure Version 6 signing
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unjam-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          EXPECTED_SHA1="$(printf '%s' "$EXPECTED_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = re.sub(r'version/code=\d+', 'version/code=6', s)
          s = re.sub(r'version/name="[^"]*"', 'version/name="1.0.6"', s)
          s = s.replace('package/signed=false', 'package/signed=true')
          p.write_text(s)
          PY

          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'version/code=6' export_presets.cfg
          grep -Fx 'version/name="1.0.6"' export_presets.cfg
          grep -Fx 'package/signed=true' export_presets.cfg
          grep -Fx 'gradle_build/export_format=1' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Import and run Water release regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          for t in validate_water_selection_release_visibility validate_water_tube_3d_layering validate_runtime_efficiency validate_gameplay_interactions; do
            timeout 180s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Export signed Version 6 AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-release Android build/android/UNJAM-Version-6-Signed.aab 2>&1 | tee android-v6-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-v6-aab-export.log; then exit 1; fi
          test -s build/android/UNJAM-Version-6-Signed.aab

      - name: Verify signed Version 6 AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/android/UNJAM-Version-6-Signed.aab
          jarsigner -verify -verbose -certs "$AAB" | tee build/android/jarsigner-verify.log
          grep -F "jar verified." build/android/jarsigner-verify.log
          unzip -t "$AAB" | tee build/android/aab-zip-test.log
          BUNDLE_SHA1="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          EXPECTED_SHA1="$(printf '%s' "$EXPECTED_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
          test "$BUNDLE_SHA1" = "$EXPECTED_SHA1"
          sha256sum "$AAB" | tee build/android/UNJAM-Version-6-Signed.aab.sha256
          printf '%s\n' "$BUNDLE_SHA1" > build/android/UNJAM-Version-6.signing-sha1.txt

      - name: Upload signed Version 6 AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-6-signed-aab
          path: |
            build/android/UNJAM-Version-6-Signed.aab
            build/android/UNJAM-Version-6-Signed.aab.sha256
            build/android/UNJAM-Version-6.signing-sha1.txt
            build/android/jarsigner-verify.log
            build/android/aab-zip-test.log
          if-no-files-found: error
          retention-days: 14
