name: UNJAM Installable Release-Mode QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release-test-apk.yml"
      # Verify release-mode APKs whenever shipped gameplay/navigation changes.
      - "scripts/ui/**"
      - "scripts/game/**"
      - "scripts/core/**"
      - "scenes/**"
      - "tests/validate_block_magnetic_target.gd"
      - "tests/validate_block_real_touch_integration.gd"
      - "tests/validate_async_game_scene_launch.gd"

# Release-optimized, signed with a temporary QA certificate.
# This is NOT Google Play production signing; advertising stays in test mode.
permissions:
  contents: read

concurrency:
  group: unjam-installable-release-qa
  cancel-in-progress: true

jobs:
  release-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Godot 4.7.2 with Android export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
      - name: Render launcher and splash assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tools/prepare_android_brand_assets.gd
          test -s assets/icon_user_512.png
          test -s assets/icon_launcher_adaptive_432.png
          test -s assets/splash_emblem_safe_432.png
      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ANDROID_HOME"
          test -n "$ROOT"
          SDKMANAGER="$(find "$ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          STATUS=$?
          set -o pipefail
          test "$STATUS" -eq 0
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install AdMob and Play Billing plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh
          test -f addons/admob/android/bin/ads/poing_godot_admob_ads.gd
      - name: Configure release-mode QA export
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'package/signed=true' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fx 'test_mode=false' project.godot
          grep -Fx 'admob_test_mode=true' project.godot
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          VERSION_CODE="$(sed -n 's/^version\/code=//p' export_presets.cfg | head -1)"
          VERSION_NAME="$(sed -n 's/^version\/name="\([^"]*\)"$/\1/p' export_presets.cfg | head -1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          sed -i "s|^version/name=.*$|version/name=\"$VERSION_NAME-qa\"|" export_presets.cfg
          echo "QA_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "QA_VERSION_NAME=$VERSION_NAME-qa" >> "$GITHUB_ENV"
          grep -Fx 'gradle_build/export_format=0' export_presets.cfg
          grep -Fx "version/name=\"$VERSION_NAME-qa\"" export_presets.cfg
      - name: Generate a temporary non-Play QA signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unjam-release-qa.p12"
          PASSWORD="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$KEYSTORE" -alias unjam_qa -keyalg RSA -keysize 3072 \
            -validity 120 -dname "CN=UNJAM QA APK, OU=Testing, O=UNJAM, C=NG" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" >/dev/null
          chmod 600 "$KEYSTORE"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=unjam_qa" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -alias unjam_qa -storepass "$PASSWORD" >/dev/null
      - name: Import Godot project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee qa-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" qa-import.log; then exit 1; fi
      - name: Test gameplay, navigation and reward paths
        shell: bash
        run: |
          set -euo pipefail
          UNJAM_ANDROID_BRAND_RASTER_READY=1 timeout 60s godot --headless --path . --script res://tests/validate_android_brand_raster.gd
          for test in validate_async_game_scene_launch validate_gameplay_interactions validate_navigation_hierarchy_density validate_daily_wallet_visibility validate_block_magnetic_target validate_block_real_touch_integration validate_monetization validate_admob_production validate_billing_production; do
            timeout 90s godot --headless --path . --script "res://tests/$test.gd"
          done
      - name: Export signed Android release-mode QA APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/unjam-release-qa.apk 2>&1 | tee qa-release-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access|AdMob: Android library not found" qa-release-export.log; then exit 1; fi
          test -s build/android/unjam-release-qa.apk
      - name: Verify APK signature and Android identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android/unjam-release-qa.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee build/android/qa-badging.txt
          "$AAPT" dump permissions "$APK" | tee build/android/qa-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/android/qa-manifest.txt
          grep -F "package: name='com.eghosa.unjamgam' versionCode='$QA_VERSION_CODE' versionName='$QA_VERSION_NAME'" build/android/qa-badging.txt
          grep -F "targetSdkVersion:'36'" build/android/qa-badging.txt
          grep -F "native-code: 'arm64-v8a'" build/android/qa-badging.txt
          grep -F "com.google.android.gms.permission.AD_ID" build/android/qa-permissions.txt
          grep -F "com.android.vending.BILLING" build/android/qa-permissions.txt
          grep -F "com.google.android.gms.ads.APPLICATION_ID" build/android/qa-manifest.txt
          grep -F "org.godotengine.plugin.v2.GodotGooglePlayBilling" build/android/qa-manifest.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/android/qa-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' build/android/qa-signature.txt
          grep -E '(V2 Signer|Signer #1):? certificate SHA-256 digest:' build/android/qa-signature.txt
          sha256sum "$APK" | tee build/android/unjam-release-qa.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > build/android/unjam-release-qa.commit
          printf '%s\n' 'Release-mode QA build; test signed, not signed with the Google Play production key. AdMob test mode remains enabled.' > build/android/README-QA.txt
      - name: Upload verified release-mode QA APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-release-mode-qa-apk
          path: |
            build/android/unjam-release-qa.apk
            build/android/unjam-release-qa.apk.sha256
            build/android/unjam-release-qa.commit
            build/android/qa-badging.txt
            build/android/qa-permissions.txt
            build/android/qa-manifest.txt
            build/android/qa-signature.txt
            build/android/README-QA.txt
          if-no-files-found: error
          retention-days: 7
