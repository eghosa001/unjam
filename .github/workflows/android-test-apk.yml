name: Android Latest Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/systems/feedback_manager.gd"
      - "scripts/game/**"
      - "scripts/ui/robust_main.gd"
      - "scripts/ui/premium_home_direct_levels.gd"
      - "scripts/ui/premium_main_casual.gd"
      - "scripts/ui/premium_live_hub.gd"
      - "scripts/ui/boot_splash.gd"
      - "scripts/ui/ui_touch_enhancer.gd"
      - "tests/validate_runtime_efficiency.gd"
      - "scenes/Boot.tscn"
      - "scripts/systems/android_monetization_bridge.gd"
      - "scripts/systems/privacy_manager.gd"
      - "scripts/systems/store_manager.gd"
      - "addons/unjam_admob_provider.gd"
      - "tools/install_monetization_plugins.sh"
      - "assets/**"
      - "store_assets/**"

permissions:
  contents: read

concurrency:
  group: android-latest-test-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Prepare Android launcher and splash rasters
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tools/prepare_android_brand_assets.gd
          test -s assets/icon_user_512.png
          test -s assets/icon_launcher_adaptive_432.png
          test -s assets/icon_user_adaptive_432.png
          test -s assets/splash_emblem_safe_432.png
          test -s assets/unjam_startup_logo.png

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install Android monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh
          test -f addons/admob/android/bin/ads/poing_godot_admob_ads.gd

      - name: Prepare APK export preset
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fx 'test_mode=false' project.godot
          grep -Fx 'admob_test_mode=true' project.godot
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          sed -i 's/version\/code=[0-9]\+/version\/code=10/' export_presets.cfg
          sed -i 's/version\/name="[^"]*"/version\/name="1.0.10-test"/' export_presets.cfg
          grep -Fx 'gradle_build/export_format=0' export_presets.cfg
          grep -Fx 'version/code=10' export_presets.cfg
          grep -Fx 'version/name="1.0.10-test"' export_presets.cfg

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee android-test-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-test-import.log; then exit 1; fi

      - name: Run focused launch, audio and monetization checks
        shell: bash
        run: |
          set -euo pipefail
          for t in validate_launcher_icon_safe_zone validate_touch_enhancer_scope validate_bottom_nav_touch_zones validate_navigation_state_and_text_fit_v8 validate_soothing_audio_palette validate_feedback_manager_event_driven_music validate_runtime_efficiency validate_gameplay_interactions validate_monetization validate_restore_purchase_flow validate_admob_production validate_billing_production; do
            timeout 60s godot --headless --path . --script "res://tests/$t.gd"
          done

      - name: Export latest test APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-debug Android build/android/unjam-latest-debug.apk 2>&1 | tee android-test-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access|AdMob: Android library not found" android-test-export.log; then exit 1; fi
          test -s build/android/unjam-latest-debug.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android/unjam-latest-debug.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee build/android/unjam-latest-debug-badging.txt
          "$AAPT" dump permissions "$APK" | tee build/android/unjam-latest-debug-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/android/unjam-latest-debug-manifest.txt
          grep -F "package: name='com.eghosa.unjamgam' versionCode='10' versionName='1.0.10-test'" build/android/unjam-latest-debug-badging.txt
          grep -F "targetSdkVersion:'36'" build/android/unjam-latest-debug-badging.txt
          grep -F "native-code: 'arm64-v8a'" build/android/unjam-latest-debug-badging.txt
          grep -F "com.google.android.gms.permission.AD_ID" build/android/unjam-latest-debug-permissions.txt
          grep -F "com.android.vending.BILLING" build/android/unjam-latest-debug-permissions.txt
          grep -F "com.google.android.gms.ads.APPLICATION_ID" build/android/unjam-latest-debug-manifest.txt
          grep -F "ca-app-pub-7517898921176341~1892369383" build/android/unjam-latest-debug-manifest.txt
          grep -F "org.godotengine.plugin.v2.GodotGooglePlayBilling" build/android/unjam-latest-debug-manifest.txt
          # Large-screen eligibility: keep tablet/foldable support explicit in
          # the packaged manifest, not just in project source settings.
          grep -F "android:largeScreens" build/android/unjam-latest-debug-manifest.txt
          grep -F "android:xlargeScreens" build/android/unjam-latest-debug-manifest.txt
          grep -F "android:resizeableActivity" build/android/unjam-latest-debug-manifest.txt
          grep -F "android:appCategory" build/android/unjam-latest-debug-manifest.txt
          FOREGROUND_BYTES="$(unzip -p "$APK" res/mipmap-xxxhdpi-v4/icon_foreground.webp | wc -c)"
          SPLASH_BYTES="$(unzip -p "$APK" res/drawable/splash_icon.webp | wc -c)"
          echo "Packaged adaptive foreground bytes: $FOREGROUND_BYTES"
          echo "Packaged splash icon bytes: $SPLASH_BYTES"
          test "$FOREGROUND_BYTES" -gt 1000
          test "$SPLASH_BYTES" -gt 1000
          sha256sum "$APK" | tee build/android/unjam-latest-debug.apk.sha256

      - name: Upload latest test APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-latest-debug-apk
          path: |
            build/android/unjam-latest-debug.apk
            build/android/unjam-latest-debug.apk.sha256
            build/android/unjam-latest-debug-badging.txt
            build/android/unjam-latest-debug-permissions.txt
            build/android/unjam-latest-debug-manifest.txt
          if-no-files-found: error
          retention-days: 7

