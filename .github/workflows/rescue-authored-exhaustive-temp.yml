name: Rescue Authored Exhaustive Temp

on:
  push:
    branches:
      - feature/rescue-rush-authored-10000-20260925

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false

      - name: Disable release-only editor plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.godot")
          text = path.read_text()
          enabled = 'enabled=PackedStringArray("res://addons/admob/plugin.cfg", "res://addons/GodotGooglePlayBilling/plugin.cfg")'
          if enabled not in text:
              raise SystemExit("Expected monetization editor-plugin declaration is missing")
          path.write_text(text.replace(enabled, "enabled=PackedStringArray()"))
          PY

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee rescue-authored-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" rescue-authored-import.log; then exit 1; fi

      - name: Validate authored recipes
        shell: bash
        run: |
          set -o pipefail
          timeout 300s godot --headless --path . --script res://tests/validate_rescue_authored_catalog_10000.gd 2>&1 | tee rescue-authored-catalog.log

      - name: Generate and validate all 10000 Rescue boards
        shell: bash
        run: |
          set -o pipefail
          timeout 3000s godot --headless --path . --script res://tests/validate_campaign.gd 2>&1 | tee rescue-authored-exhaustive.log

      - name: Upload exhaustive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-authored-exhaustive-logs
          path: |
            rescue-authored-import.log
            rescue-authored-catalog.log
            rescue-authored-exhaustive.log
          if-no-files-found: warn
