name: Latest Test APK

on:
  push:
    branches:
      - build/latest-test-apk-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Import project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit

      - name: Export latest debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          sed -i 's/gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          godot --headless --verbose --path . --install-android-build-template --export-debug Android build/android/unjam-latest-test.apk 2>&1 | tee android-test-apk-export.log
          test -s build/android/unjam-latest-test.apk
          sha256sum build/android/unjam-latest-test.apk | tee build/android/unjam-latest-test.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-latest-test-apk-4e1c8b29
          path: |
            build/android/unjam-latest-test.apk
            build/android/unjam-latest-test.apk.sha256
            android-test-apk-export.log
          if-no-files-found: error
          retention-days: 7
