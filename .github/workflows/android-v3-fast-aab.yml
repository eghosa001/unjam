name: UNJAM Version 3 Fast AAB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-v3-fast-aab.yml"

permissions:
  contents: read

jobs:
  build-fast-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Version 3 metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'version/code=3' export_presets.cfg
          grep -Fx 'version/name="1.0.3"' export_presets.cfg
          python3 tools/validate_release_contract.py

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Configure signing or unsigned fallback
        env:
          KEYSTORE_B64: ${{ secrets.UNJAM_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UNJAM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNJAM_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/unjam-release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            printf 'signed\n' > build-signing-status.txt
          else
            sed -i 's/package\/signed=true/package\/signed=false/' export_presets.cfg
            printf 'unsigned\nreason=GitHub Actions production keystore secrets are not configured\n' > build-signing-status.txt
          fi

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee fast-aab-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" fast-aab-import.log; then exit 1; fi

      - name: Export Version 3 AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/UNJAM-Version-3.aab 2>&1 | tee fast-aab-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" fast-aab-export.log; then exit 1; fi
          test -s build/android/UNJAM-Version-3.aab
          unzip -t build/android/UNJAM-Version-3.aab > build/android/aab-zip-test.log
          sha256sum build/android/UNJAM-Version-3.aab | tee build/android/UNJAM-Version-3.aab.sha256

      - name: Upload Version 3 AAB
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-3-fast-aab
          path: |
            build/android/UNJAM-Version-3.aab
            build/android/UNJAM-Version-3.aab.sha256
            build/android/aab-zip-test.log
            build-signing-status.txt
          if-no-files-found: error
          retention-days: 14
