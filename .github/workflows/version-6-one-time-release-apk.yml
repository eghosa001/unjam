name: UNJAM Version 6 One-Time Release APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/version-6-one-time-release-apk.yml"

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_ROOT"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_STATUS" -eq 0
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

      - name: Install monetization plugins
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/install_monetization_plugins.sh
          tools/install_monetization_plugins.sh

      - name: Configure one-time release APK signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unjam-v6-test-release.jks"
          PASS="unjam-v6-release-test"
          ALIAS="unjam-v6-test"
          keytool -genkeypair -noprompt             -keystore "$KEYSTORE"             -storepass "$PASS"             -keypass "$PASS"             -alias "$ALIAS"             -keyalg RSA             -keysize 4096             -validity 3650             -dname "CN=UNJAM Version 6 Release Test,O=UNJAM,C=NG"

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = re.sub(r'version/code=\d+', 'version/code=6', s)
          s = re.sub(r'version/name="[^"]*"', 'version/name="1.0.6"', s)
          s = s.replace('gradle_build/export_format=1', 'gradle_build/export_format=0')
          s = s.replace('package/signed=false', 'package/signed=true')
          p.write_text(s)
          PY

          grep -Fx 'package/unique_name="com.eghosa.unjamgam"' export_presets.cfg
          grep -Fx 'version/code=6' export_presets.cfg
          grep -Fx 'version/name="1.0.6"' export_presets.cfg
          grep -Fx 'package/signed=true' export_presets.cfg
          grep -Fx 'gradle_build/export_format=0' export_presets.cfg

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Run Water selection release regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          timeout 180s godot --headless --path . --script res://tests/validate_water_selection_release_visibility.gd
          timeout 180s godot --headless --path . --script res://tests/validate_water_tube_3d_layering.gd
          timeout 180s godot --headless --path . --script res://tests/validate_gameplay_interactions.gd

      - name: Export one-time release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --install-android-build-template --export-release Android build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk 2>&1 | tee android-v6-release-apk.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compilation failed|Invalid call|Invalid access" android-v6-release-apk.log; then exit 1; fi
          test -s build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk

      - name: Verify APK package and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee build/android/apk-badging.txt
          grep -F "package: name='com.eghosa.unjamgam' versionCode='6' versionName='1.0.6'" build/android/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/android/apksigner-verify.txt
          grep -F "Verifies" build/android/apksigner-verify.txt
          sha256sum "$APK" | tee build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk.sha256

      - name: Upload one-time release APK
        uses: actions/upload-artifact@v4
        with:
          name: unjam-version-6-one-time-release-apk
          path: |
            build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk
            build/android/UNJAM-Version-6-ONE-TIME-RELEASE.apk.sha256
            build/android/apk-badging.txt
            build/android/apksigner-verify.txt
          if-no-files-found: error
          retention-days: 2
