<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="72" y1="20" x2="438" y2="500" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#153BFF"/><stop offset=".42" stop-color="#118DEB"/><stop offset=".73" stop-color="#1737D6"/><stop offset="1" stop-color="#4110A5"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="33%" r="68%"><stop offset="0" stop-color="#58DEFF" stop-opacity=".75"/><stop offset=".5" stop-color="#27A9FF" stop-opacity=".20"/><stop offset="1" stop-color="#250A86" stop-opacity="0"/></radialGradient>
  <linearGradient id="rim" x1="105" y1="83" x2="400" y2="392" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#BFEAFF"/><stop offset=".55" stop-color="#F9FAFF"/><stop offset=".78" stop-color="#A4B8FF"/><stop offset="1" stop-color="#6C56D9"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31D9FF"/><stop offset=".5" stop-color="#0878F4"/><stop offset="1" stop-color="#1030C8"/></linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF56A"/><stop offset=".5" stop-color="#FFC517"/><stop offset="1" stop-color="#F39A00"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF75C9"/><stop offset=".48" stop-color="#F81D8A"/><stop offset="1" stop-color="#B90063"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83FF6B"/><stop offset=".48" stop-color="#12D432"/><stop offset="1" stop-color="#068E27"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6C65"/><stop offset=".5" stop-color="#F3323A"/><stop offset="1" stop-color="#BB142E"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB533"/><stop offset=".45" stop-color="#D87115"/><stop offset="1" stop-color="#87400A"/></linearGradient>
  <linearGradient id="woodDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B85C0D"/><stop offset="1" stop-color="#552502"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#EAF0FF"/><stop offset="1" stop-color="#98A6FF"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
