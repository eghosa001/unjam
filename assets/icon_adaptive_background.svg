<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
<defs>
  <!-- Matched to the approved UNJAM icon art so Android masks never reveal a
       contrasting square behind the transparent foreground. -->
  <linearGradient id="bg" x1="216" y1="0" x2="216" y2="432" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0F62C8"/>
    <stop offset=".48" stop-color="#1554C8"/>
    <stop offset="1" stop-color="#210C69"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="28%" r="72%">
    <stop offset="0" stop-color="#26A7FF" stop-opacity=".42"/>
    <stop offset=".72" stop-color="#1749C2" stop-opacity=".08"/>
    <stop offset="1" stop-color="#210C69" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="432" height="432" fill="url(#bg)"/>
<rect width="432" height="432" fill="url(#glow)"/>
</svg>
